name: Update organization star badge

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: cloe-org
        run: python scripts/update_star_badge.py

      - name: Commit updated badge
        run: |
          if git diff --quiet -- badge/star-badge.json; then
            echo "Badge is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badge/star-badge.json
          git commit -m "Update organization star badge"
          git push
